<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unicorn Squad Belgia</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 25px;
      text-align: center;
    }

    .logo {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 10px;
    }

    .subtitle {
      font-size: 18px;
      color: #666;
      margin-bottom: 45px;
    }

    .lessons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .lesson {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 95px;
      padding: 20px;

      background: white;
      border-radius: 14px;

      text-decoration: none;
      color: #222;

      font-size: 20px;
      font-weight: bold;

      box-shadow: 0 3px 12px rgba(0,0,0,0.08);

      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .lesson:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 18px rgba(0,0,0,0.13);
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px 18px;
      }

      h1 {
        font-size: 28px;
      }

      .lessons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="hk unicorn squad_1.png"
         alt="HK Unicorn Squad"
         class="logo">

    <h1>Unicorn Squad Belgium</h1>

    <div class="subtitle">
      Õppematerjalid
    </div>

    <div class="lessons">

      <a class="lesson" href="heli_1.html">
        Heli
      </a>

      <a class="lesson" href="animatsioon.html">
        Animatsioon
      </a>

      <a class="lesson" href="led-mask.html">
        LED-mask
      </a>

      <a class="lesson" href="ohukahur_1.html">
        Õhukahur
      </a>

    </div>

  </div>

</body>
</html>
